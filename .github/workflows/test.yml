name: Transfer safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned local-test rclone
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) platform=linux-amd64 ;;
            macOS/ARM64) platform=osx-arm64 ;;
            macOS/X64) platform=osx-amd64 ;;
            *) exit 1 ;;
          esac
          archive="rclone-v1.75.1-${platform}.zip"
          curl --fail --location --retry 3 "https://downloads.rclone.org/v1.75.1/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 "https://downloads.rclone.org/v1.75.1/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          python3 - "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/SHA256SUMS" <<'PY'
          import pathlib,hashlib,sys,zipfile
          archive=pathlib.Path(sys.argv[1]);expected=None
          for line in pathlib.Path(sys.argv[2]).read_text().splitlines():
              fields=line.split()
              if len(fields)>1 and fields[-1].lstrip('*')==archive.name: expected=fields[0]
          assert expected and hashlib.sha256(archive.read_bytes()).hexdigest()==expected, 'Archive checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              name=next(n for n in z.namelist() if n.endswith('/rclone'))
              target=pathlib.Path('vendor/rclone');target.write_bytes(z.read(name));target.chmod(0o755)
          PY
      - run: npm ci
      - run: npm test
      - run: python3 tests/test_upgrade_preflight.py
      - run: node tools/benchmark-core.cjs > benchmark-core.json
      - run: node tools/benchmark-transfer.cjs --output benchmark-transfer.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.node }}
          path: benchmark-*.json
