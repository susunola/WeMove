<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeMove · 网盘搬运助手</title><link rel="icon" type="image/png" href="/assets/panmover-logo.png?key=__KEY__"><link rel="stylesheet" href="/styles.css?key=__KEY__"><script defer src="/i18n.js?key=__KEY__"></script><script defer src="/compare.js?key=__KEY__"></script><script defer src="/app.js?key=__KEY__"></script></head><body>
<main class="window"><header class="app-header"><div class="app-identity"><span class="app-symbol"><img class="app-logo" src="/assets/panmover-logo.png?key=__KEY__" alt=""></span><span class="brand" aria-label="WeMove"><span class="brand-we">We</span><span class="brand-move">Move</span></span></div><div class="view-switch" role="group" aria-label="浏览模式"><button id="view-browse" class="chosen">浏览</button><button id="view-compare">对比</button></div><div class="toolbar-actions"><div class="language-switcher"><button id="language" type="button" aria-label="Language / 语言" aria-haspopup="menu" aria-expanded="false"><span id="language-label">中文</span><svg class="icon" aria-hidden="true"><use href="/icons.svg?key=__KEY__#chevron-right"></use></svg></button><div id="language-menu" role="menu" aria-label="Language / 语言" hidden><button type="button" role="menuitemradio" data-language="zh-CN" aria-checked="true">简体中文</button><button type="button" role="menuitemradio" data-language="en" aria-checked="false">English</button></div></div><button id="compare">对比两边</button><button id="incremental" class="primary">增量复制</button></div><button id="help" class="icon-button" aria-label="使用说明"></button></header>
<div class="content-shell"><aside class="sidebar"><p class="sidebar-heading">网盘账号</p><div class="storage-search"><input id="storage-search" type="search" placeholder="搜索存储" aria-label="搜索存储"></div><div id="accounts"></div><button id="add-storage" class="add-storage">＋ 添加存储</button><p class="sidebar-note">点击账号切换当前栏</p><div class="sidebar-bottom"><button id="sync-plans">同步方案</button><button id="recovery-center">恢复中心</button><button id="diagnostics">传输诊断</button><button id="sidebar-cache">缓存管理</button><button id="settings">传输设置</button><button id="about">关于</button></div></aside><div class="browser-area"><div class="workspace"><section class="pane" id="left" aria-label="左侧网盘"></section><section class="pane" id="right" aria-label="右侧网盘"></section></div><div class="comparison-strip"><span id="comparison-summary">双击进入文件夹 · 右键复制到另一侧</span><div><label><input id="recursive" type="checkbox">递归对比</label><button id="comparison-details" disabled>查看差异</button><button id="export-comparison" disabled>导出清单</button></div></div></div></div>
<section class="queue"><header><div class="queue-title"><h2>传输队列 <span id="queue-count">0</span></h2><span id="queue-summary">暂无运行中的任务</span></div><label class="transfer-setting">同时传输 <select id="concurrency" aria-label="同时传输文件数"><option value="1">1 个文件</option><option value="2">2 个文件</option><option value="3" selected>3 个文件</option><option value="4">4 个文件</option><option value="6">6 个文件</option></select></label><button id="history-clear">清理已结束</button><button id="start-all" class="primary">全部开始</button><button id="pause-all">暂停全部</button></header><div class="queue-columns"><span>名称</span><span>来源 → 目标</span><span>进度</span><span>状态</span><span>速度 / 预计时间</span><span>操作</span></div><div id="jobs" class="jobs"><p class="queue-empty">选中文件，右键复制到另一侧目录。</p></div></section>
<footer class="statusbar"><span><i class="status-dot"></i> 本机运行</span><span id="status-hint">复制保留原文件 · 通过 Mac 中转</span><button id="tools">工具</button><button id="cache">缓存管理</button></footer></main>
<div id="context" class="context" hidden role="menu"></div><div id="toast" role="status" hidden></div>
<dialog id="connect-dialog"><header><h2 id="connect-title">连接网盘</h2><button class="icon-button close-dialog" aria-label="关闭"></button></header><div id="connect-body"></div><div id="auth-progress" class="auth-progress" hidden><p id="auth-message"></p><a id="auth-link" target="_blank" rel="noopener noreferrer" hidden>打开授权页面</a><div id="auth-question"></div><div class="auth-buttons"><button id="continue-ali" class="primary" hidden>已完成扫码，继续</button><button id="cancel-auth">取消本次连接</button></div></div></dialog>
<dialog id="simple-dialog"><header><h2 id="simple-title"></h2><button class="icon-button close-dialog" aria-label="关闭"></button></header><div id="simple-body"></div></dialog>
</body></html>
